[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[project]
authors = [{name = "The BeMoBIL-MNE team"}]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]
dependencies = [
  "matplotlib",
  "meegkit",
  "mne",
  "mne_bids",
  "mne-denoise",
  "mne-faster",
  "mne-icalabel",
  "nibabel",
  "numpy",
  "onnxruntime",
  "pandas",
  "plotly",
  "pylsl",
  "pybv",
  "pyprep",
  "python-picard",
  "pyxdf",
  "scikit-learn",
]
description = "MoBI data loading, preprocessing, and visualization built on MNE-Python"
dynamic = ["version"]
keywords = [
  "eeg",
  "eye-tracking",
  "neuroscience",
  "data analysis",
]
license = {text = "Roy Eric Random. All rights reserved."}
maintainers = [
  {email = "eric.wieske@gmail.com", name = "Roy Eric Wieske"},
]
name = "BeMoBIL-MNE"
readme = {content-type = "text/markdown", file = "README.md"}
requires-python = ">=3.10"

[project.optional-dependencies]
# Dependencies for developer installations
dev = ["build", "BeMoBIL-MNE[test]", "ipykernel", "ipython", "pre-commit", "ruff", "twine"]
# Dependencies for building the documentation
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "numpydoc",
    "sphinx-copybutton",
]
# Dependencies for running the test infrastructure
test = ["BeMoBIL-MNE", "pytest", "pytest-cov", "pytest-sugar", "pytest-xdist"]

[project.urls]
"Bug Tracker" = "https://github.com/BeMoBIL/bemobil-mne/issues/"
"Documentation" = "https://bemobil.github.io/bemobil-mne/"
"Source Code" = "https://github.com/BeMoBIL/bemobil-mne/"

[tool.hatch.build]
exclude = [
  "**/tests",
  "/.*",
]

[tool.hatch.build.targets.wheel]
packages = ["bemobil_mne"]

[tool.hatch.metadata]
allow-direct-references = true  # allow specifying URLs in our dependencies

[tool.hatch.version]
raw-options = {version_scheme = "release-branch-semver"}
source = "vcs"

[tool.pytest.ini_options]
addopts = """--cov=bemobil_mne --cov-report=html --cov-config=pyproject.toml
    --durations=20 -ra --junit-xml=junit-results.xml --tb=short
    --ignore=doc --ignore=examples --ignore=mne_bids/tests/data -n auto"""
filterwarnings = [
  "ignore::ImportWarning",
  "ignore::DeprecationWarning:mne",
]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*tests*", "bemobil_mne/examples/*"]
source = ["bemobil_mne"]
# Required for pytest-xdist: each worker writes its own .coverage.* file
# which coverage combine merges at the end.
parallel = true

[tool.coverage.report]
exclude_lines = ["if 0:", "if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["A", "D", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.tomlsort]
all = true
ignore_case = true
spaces_before_inline_comment = 2
trailing_comma_inline_array = true
